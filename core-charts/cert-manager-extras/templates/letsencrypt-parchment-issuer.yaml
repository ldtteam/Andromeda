apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-parchment
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: {{ .Values.email }}
    privateKeySecretRef:
      name: letsencrypt-parchment
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: parchmentmc-cloudflare-api-token-secret
              key: api-token