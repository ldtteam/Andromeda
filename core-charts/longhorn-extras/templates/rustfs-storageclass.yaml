kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: rustfs-storage
provisioner: driver.longhorn.io
allowVolumeExpansion: true
parameters:
  # RustFS already distributes data across its own cluster members.
  # Keep Longhorn at a single replica to avoid compounding replication overhead.
  numberOfReplicas: "1"
  staleReplicaTimeout: "2880" # 48 hours in minutes

