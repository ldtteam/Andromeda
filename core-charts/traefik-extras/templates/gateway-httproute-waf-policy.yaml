# Stamp a WAF profile annotation on every HTTPRoute for observability.
# The actual WAF enforcement (Coraza CRS) is applied globally at the Traefik
# entrypoint level — no per-route policy check is needed.
#
# App repos can override the default profile per route by setting annotation:
#   ldtteam-waf-profile: waf-<profile-name>
apiVersion: mutations.gatekeeper.sh/v1
kind: AssignMetadata
metadata:
  name: httproute-default-waf-profile
spec:
  match:
    scope: Namespaced
    kinds:
      - apiGroups: ["gateway.networking.k8s.io"]
        kinds: ["HTTPRoute"]
  location: "metadata.annotations.ldtteam-waf-profile"
  parameters:
    assign:
      value: "waf-crs"
