# Create role assignment that assigns backup-manager role to the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-masterkey-manager
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-masterkey-manager
subjects:
- kind: ServiceAccount
  name: backup-masterkey-manager
  namespace: kube-system