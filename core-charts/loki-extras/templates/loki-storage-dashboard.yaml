---
# Loki Operational Dashboard
# Covers: write path throughput, read path latency, ingester health,
#         compactor activity, RustFS S3 errors, and 31-day retention status.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-operational-dashboard
  namespace: prometheus
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: loki
data:
  loki-operational.json: |
    {
      "title": "Loki — Operational Overview",
      "uid": "loki-operational",
      "tags": ["loki", "logging"],
      "schemaVersion": 38,
      "refresh": "1m",
      "time": { "from": "now-3h", "to": "now" },
      "panels": [

        { "id": 1, "type": "row", "title": "Write Path", "gridPos": { "x": 0, "y": 0, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 2, "type": "timeseries",
          "title": "Distributor — Ingestion Rate (bytes/s)",
          "gridPos": { "x": 0, "y": 1, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "Bps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(loki_distributor_bytes_received_total[5m]))", "legendFormat": "Total ingest rate", "refId": "A" },
            { "expr": "sum by (pod) (rate(loki_distributor_bytes_received_total[5m]))", "legendFormat": "{{ "{{pod}}" }}", "refId": "B" }
          ]
        },
        {
          "id": 3, "type": "timeseries",
          "title": "Distributor — Lines Received / s",
          "gridPos": { "x": 12, "y": 1, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(loki_distributor_lines_received_total[5m]))", "legendFormat": "Lines/s", "refId": "A" }
          ]
        },
        {
          "id": 4, "type": "timeseries",
          "title": "Ingester — Chunks Flushed / s (to S3)",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(loki_ingester_chunk_stored_total[5m]))", "legendFormat": "Chunks flushed/s", "refId": "A" }
          ]
        },
        {
          "id": 5, "type": "timeseries",
          "title": "Ingester — Flush Errors / s",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "fillOpacity": 20 },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.1 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "targets": [
            { "expr": "sum(rate(loki_ingester_failed_flushes_total[5m]))", "legendFormat": "Flush errors/s", "refId": "A" }
          ]
        },
        {
          "id": 6, "type": "stat",
          "title": "Ingester — Ring Members",
          "description": "Number of healthy instances in the ingester ring. Must equal replica count.",
          "gridPos": { "x": 0, "y": 15, "w": 6, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 2 }, { "color": "green", "value": 3 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "count(loki_ring_members{name=\"ingester\",state=\"ACTIVE\"})", "legendFormat": "Active ingesters", "refId": "A" }
          ]
        },
        {
          "id": 7, "type": "stat",
          "title": "WAL Replay Errors",
          "gridPos": { "x": 6, "y": 15, "w": 6, "h": 4 },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            { "expr": "sum(increase(loki_ingester_wal_corruptions_total[1h]))", "legendFormat": "WAL corruptions (1h)", "refId": "A" }
          ]
        },

        { "id": 10, "type": "row", "title": "Read Path", "gridPos": { "x": 0, "y": 20, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 11, "type": "timeseries",
          "title": "Query Frontend — Request Rate (by status)",
          "gridPos": { "x": 0, "y": 21, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum by (status_code) (rate(loki_request_duration_seconds_count{job=~\"loki/query-frontend\"}[5m]))", "legendFormat": "{{ "{{status_code}}" }}", "refId": "A" }
          ]
        },
        {
          "id": 12, "type": "timeseries",
          "title": "Query Frontend — P99 Latency",
          "gridPos": { "x": 12, "y": 21, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le, route) (rate(loki_request_duration_seconds_bucket{job=~\"loki/query-frontend\"}[5m])))", "legendFormat": "P99 {{ "{{route}}" }}", "refId": "A" },
            { "expr": "histogram_quantile(0.50, sum by (le, route) (rate(loki_request_duration_seconds_bucket{job=~\"loki/query-frontend\"}[5m])))", "legendFormat": "P50 {{ "{{route}}" }}", "refId": "B" }
          ]
        },
        {
          "id": 13, "type": "timeseries",
          "title": "Querier — In-Flight Queries",
          "gridPos": { "x": 0, "y": 28, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(loki_query_scheduler_inflight_requests)", "legendFormat": "In-flight", "refId": "A" }
          ]
        },
        {
          "id": 14, "type": "timeseries",
          "title": "Chunks Cache — Hit Rate",
          "gridPos": { "x": 12, "y": 28, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0, "max": 1, "custom": { "fillOpacity": 10 } } },
          "targets": [
            {
              "expr": "sum(rate(loki_cache_fetched_keys_total{name=\"chunks\"}[5m])) > 0\n  and on()\nsum(rate(loki_cache_hits_total{name=\"chunks\"}[5m]))\n/ sum(rate(loki_cache_fetched_keys_total{name=\"chunks\"}[5m]))",
              "legendFormat": "Chunks cache hit rate", "refId": "A"
            }
          ]
        },

        { "id": 20, "type": "row", "title": "Compactor & Retention", "gridPos": { "x": 0, "y": 36, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 21, "type": "timeseries",
          "title": "Compactor — Deleted Chunks / s (31-day retention)",
          "gridPos": { "x": 0, "y": 37, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(rate(loki_compactor_deleted_chunks_total[5m]))", "legendFormat": "Deleted chunks/s", "refId": "A" }
          ]
        },
        {
          "id": 22, "type": "timeseries",
          "title": "Compactor — Runs / Errors",
          "gridPos": { "x": 12, "y": 37, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum(increase(loki_compactor_runs_completed_total[1h]))", "legendFormat": "Completed runs (1h)", "refId": "A" },
            { "expr": "sum(increase(loki_compactor_runs_failed_total[1h]))", "legendFormat": "Failed runs (1h)", "refId": "B" }
          ]
        },

        { "id": 30, "type": "row", "title": "RustFS S3 Object Store", "gridPos": { "x": 0, "y": 45, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 31, "type": "timeseries",
          "title": "RustFS — S3 Operation Rate",
          "gridPos": { "x": 0, "y": 46, "w": 12, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "sum by (operation) (rate(loki_s3_request_duration_seconds_count[5m]))", "legendFormat": "{{ "{{operation}}" }}", "refId": "A" }
          ]
        },
        {
          "id": 32, "type": "timeseries",
          "title": "RustFS — S3 Error Rate",
          "gridPos": { "x": 12, "y": 46, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 20 },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 0.01 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "targets": [
            { "expr": "sum by (operation) (rate(loki_s3_request_duration_seconds_count{status_code=~\"5..\"}[5m]))", "legendFormat": "5xx {{ "{{operation}}" }}", "refId": "A" }
          ]
        },
        {
          "id": 33, "type": "timeseries",
          "title": "RustFS — S3 P99 Latency by Operation",
          "gridPos": { "x": 0, "y": 53, "w": 24, "h": 7 },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le, operation) (rate(loki_s3_request_duration_seconds_bucket[5m])))", "legendFormat": "P99 {{ "{{operation}}" }}", "refId": "A" }
          ]
        },

        { "id": 40, "type": "row", "title": "Longhorn PVC (Ingesters / Compactor / Index Gateway)", "gridPos": { "x": 0, "y": 61, "w": 24, "h": 1 }, "collapsed": false },

        {
          "id": 41, "type": "gauge",
          "title": "Loki PVC Used",
          "gridPos": { "x": 0, "y": 62, "w": 6, "h": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes", "min": 0,
              "thresholds": { "mode": "percentage", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [ { "expr": "longhorn_volume_actual_size_bytes{pvc_namespace=\"loki\"}", "legendFormat": "{{ "{{pvc}}" }}", "refId": "A" } ]
        },
        {
          "id": 42, "type": "gauge",
          "title": "Loki PVC Usage %",
          "gridPos": { "x": 6, "y": 62, "w": 6, "h": 6 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 70 }, { "color": "red", "value": 90 } ] },
              "color": { "mode": "thresholds" }
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdMarkers": true },
          "targets": [
            { "expr": "100 * longhorn_volume_actual_size_bytes{pvc_namespace=\"loki\"} / longhorn_volume_capacity_bytes{pvc_namespace=\"loki\"}", "legendFormat": "{{ "{{pvc}}" }} %", "refId": "A" }
          ]
        },
        {
          "id": 43, "type": "timeseries",
          "title": "Loki PVC Usage Over Time",
          "gridPos": { "x": 12, "y": 62, "w": 12, "h": 6 },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "fillOpacity": 10 } } },
          "targets": [
            { "expr": "longhorn_volume_actual_size_bytes{pvc_namespace=\"loki\"}", "legendFormat": "Used — {{ "{{pvc}}" }}", "refId": "A" },
            { "expr": "longhorn_volume_capacity_bytes{pvc_namespace=\"loki\"}", "legendFormat": "Capacity — {{ "{{pvc}}" }}", "refId": "B" }
          ]
        }

      ]
    }

