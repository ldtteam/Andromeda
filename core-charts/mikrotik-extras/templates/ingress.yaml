apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mikrotik-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-verify: "true"
    external-dns.alpha.kubernetes.io/target: "cluster.ldtteam.com"
spec:
  rules:
    - host: andromeda.firewall.ldtteam.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mikrotik-backplane
                port:
                  number: 443
  tls:
    - hosts:
        - andromeda.firewall.ldtteam.com
      secretName: mikrotik-tls