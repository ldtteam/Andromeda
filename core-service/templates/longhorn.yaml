apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.5.1
      helm:
        parameters:
          - name: tolerations
            value: "dedicated-storage=true:NoSchedule" # Allow longhorn to run on storage nodes
        values: |-
          longhornManager:
            tolerations:
              - key: "dedicated-storage"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"
          longhornDriver:
            tolerations:
              - key: "dedicated-storage"
                operator: "Equal"
                value: "true"
                effect: "NoSchedule"

          persistence:
            defaultClassReplicaCount: 1

          csi:
            attacherReplicaCount: 1
            provisionerReplicaCount: 1
            resizerReplicaCount: 1
            snapshotterReplicaCount: 1

          defaultSettings:
            replicaSoftAntiAffinity: true
            defaultReplicaCount: 3
            replicaZoneSoftAntiAffinity: true
            backupTarget: s3://ldtteam@backblaze/prod/longhorn
            backupTargetCredentialSecret: backblaze-backup-credentials
    - repoURL: {{ .Values.repository.url }}
      path: core-charts/longhorn-extras
      targetRevision: HEAD