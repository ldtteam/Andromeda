apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    # Ensure Gateway API CRDs (wave -1) are installed first
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://helm.traefik.io/traefik
      chart: traefik
      # NOTE: check https://github.com/traefik/traefik-helm-chart/releases for the latest stable
      targetRevision: v40.2.0
      helm:
        valuesObject:
          deployment:
            replicas: 3

          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: traefik
                  topologyKey: "topology.kubernetes.io/zone"

          nodeSelector:
            ldtteam.com/ingress: "true"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

          # 192.168.254.2 — next IP in the MetalLB pool after nginx (192.168.254.1).
          # After ArgoCD syncs, update the Mikrotik NAT rules to forward
          # ports 80 and 443 to this IP instead of 192.168.254.1.
          service:
            annotations:
              metallb.universe.tf/loadBalancerIPs: 192.168.254.2

          providers:
            kubernetesCRD:
              enabled: true
              # Required so IngressRouteTCP in the traefik namespace can
              # target the nginx service in the ingress-nginx namespace.
              allowCrossNamespace: true
            kubernetesGateway:
              # Enable Gateway API support while keeping legacy Traefik CRDs.
              enabled: true
              # Required for TCPRoute/TLSRoute support (experimental channel CRDs).
              experimentalChannel: true
            kubernetesIngress:
              # For now gateway api is not 100% supported. Enable the ingress route
              enabled: true
              ingressClass: "traefik"

          gateway:
            annotations:
              external-dns.alpha.kubernetes.io/target: "cluster.ldtteam.com"
            listeners:
              web:
                port: 8000
                protocol: HTTP
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: traefik-default-tls
                    namespace: traefik

          # Enable the dashboard on the internal traefik entrypoint (port 9000).
          # It is NOT exposed externally — use kubectl port-forward to access it:
          #   kubectl port-forward -n traefik svc/traefik 9000:9000
          #   Then open http://localhost:9000/dashboard/
          api:
            dashboard: true
            insecure: true


          metrics:
            prometheus:
              addEntryPointsLabels: true
              addServicesLabels: true
              serviceMonitor:
                enabled: true
                additionalLabels:
                  release: prometheus

    - repoURL: {{ .Values.repository.url }}
      path: core-charts/traefik-extras
      targetRevision: HEAD
