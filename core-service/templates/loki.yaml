{{- if (.Values.loki.enabled | default false) }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 14.0.0
      helm:
        valuesObject:
          global:
            dnsService: rke2-coredns-rke2-coredns
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage

          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 3
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            pattern_ingester:
              enabled: true
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
              retention_period: 744h  # 31 days
            compactor:
              retention_enabled: true
              delete_request_store: s3
              working_directory: /var/loki/compactor
            ruler:
              enable_api: true
            storage:
              type: s3
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
                admin: loki-admin
              s3:
                endpoint: ${LOKI_S3_ENDPOINT}
                region: ${LOKI_S3_REGION}
                accessKeyId: ${LOKI_S3_ACCESS_KEY_ID}
                secretAccessKey: ${LOKI_S3_SECRET_ACCESS_KEY}
                s3ForcePathStyle: true
                insecure: true

          monitoring:
            serviceMonitor:
              enabled: true
            rules:
              enabled: true
            dashboards:
              enabled: true

          minio:
            enabled: false

          deploymentMode: SimpleScalable

          singleBinary:
            replicas: 0

          # HA simple-scalable deployment: replicate all three planes.
          backend:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: backend
                    topologyKey: kubernetes.io/hostname
          read:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: read
                    topologyKey: kubernetes.io/hostname
          write:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: write
                    topologyKey: kubernetes.io/hostname

          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          chunksCache:
            allocatedMemory: 2000

    - repoURL: https://charts.rustfs.com
      chart: rustfs
      targetRevision: 0.4.0
      helm:
        releaseName: loki-rustfs
        valuesObject:
          replicaCount: 4
          secret:
            existingSecret: loki-object-storage
          mode:
            standalone:
              enabled: false
            distributed:
              enabled: true
          config:
            rustfs:
              region: us-east-1
              # Use namespace-local DNS names to avoid hardcoding cluster DNS suffix.
              volumes: http://loki-rustfs-{0...3}.loki-rustfs-headless:9000/data/rustfs{0...3}
          livenessProbe:
            enabled: true
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          readinessProbe:
            enabled: true
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          ingress:
            enabled: false
          gatewayApi:
            enabled: false
          storageclass:
            name: rustfs-storage
            dataStorageSize: 50Gi
            logStorageSize: 50Gi
          pdb:
            create: true
            minAvailable: 2
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi

    - repoURL: {{ .Values.repository.url }}
      path: core-charts/loki-extras
      targetRevision: HEAD
{{- end }}

