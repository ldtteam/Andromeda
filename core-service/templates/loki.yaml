{{- if (.Values.loki.enabled | default false) }}
# ══════════════════════════════════════════════════════════════════════════════
# Wave -2 — Object store: Sealed Secret + RustFS StatefulSet
# Must be fully healthy before buckets can be created.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    # Sealed Secret — credentials that both RustFS and Loki consume.
    - repoURL: {{ .Values.repository.url }}
      path: core-charts/loki-storage-extras
      targetRevision: HEAD

    # RustFS — 16-drive distributed erasure set (EC:8).
    # 16 pods × 1 drive × 200 GiB = 3.2 TiB raw → ~1.6 TiB usable.
    # Tolerates 8 simultaneous drive failures for reads; needs 9+ for writes.
    - repoURL: https://charts.rustfs.com
      chart: rustfs
      targetRevision: 0.4.0
      helm:
        releaseName: loki-rustfs
        valuesObject:
          replicaCount: 16
          secret:
            existingSecret: loki-object-storage
          mode:
            standalone:
              enabled: false
            distributed:
              enabled: true
          config:
            rustfs:
              region: us-east-1
              log_level: warn
              # 16-pod brace expansion — parsed natively by RustFS's MinIO-ported endpoint resolver.
              # Each pod owns a single /data volume; EC:8 is auto-selected for 16 drives.
              volumes: "http://loki-rustfs-{0...15}.loki-rustfs-headless:9000/data"
          affinity:
            podAntiAffinity:
              enabled: true
              topologyKey: kubernetes.io/hostname
          livenessProbe:
            enabled: true
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 8
          startupProbe:
            enabled: true
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 36   # up to 6 min for all 16 pods to form quorum
          readinessProbe:
            enabled: true
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
          ingress:
            enabled: false
          gatewayApi:
            enabled: false
          storageclass:
            name: longhorn
            dataStorageSize: 200Gi
            logStorageSize: 10Gi
          pdb:
            create: true
            minAvailable: 9          # EC:8 needs 9/16 drives for writes
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
# ══════════════════════════════════════════════════════════════════════════════
# Wave -1 — Bucket bootstrap: ensure loki-chunks, loki-ruler, loki-admin exist
# before the Loki compactor starts (compactor runs before the default bucket
# creator in Loki's startup sequence and would crash on missing buckets).
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-bucket-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: {{ .Values.repository.url }}
      path: core-charts/loki-bootstrap-extras
      targetRevision: HEAD
---
# ══════════════════════════════════════════════════════════════════════════════
# Wave 0 — Loki microservices (Distributed mode)
# Only deployed after RustFS is ready and buckets exist.
# ══════════════════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 14.0.0
      helm:
        valuesObject:
          global:
            dnsService: rke2-coredns-rke2-coredns

          deploymentMode: Distributed

          loki:
            auth_enabled: false

            commonConfig:
              replication_factor: 3
              path_prefix: /var/loki

            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: s3
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h

            ingester:
              wal:
                enabled: true
                dir: /var/loki/wal
              lifecycler:
                ring:
                  replication_factor: 3

            pattern_ingester:
              enabled: true

            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
              retention_period: 744h           # 31 days
              ingestion_rate_mb: 64
              ingestion_burst_size_mb: 128
              max_streams_per_user: 0          # unlimited (single tenant)
              max_global_streams_per_user: 0

            compactor:
              retention_enabled: true
              delete_request_store: s3
              working_directory: /var/loki/compactor

            ruler:
              enable_api: true
              storage:
                type: s3

            storage:
              type: s3
              bucketNames:
                chunks: loki-chunks
                ruler: loki-ruler
                admin: loki-admin
              s3:
                endpoint: http://loki-rustfs-svc:9000
                region: us-east-1
                accessKeyId: "${LOKI_S3_ACCESS_KEY_ID}"
                secretAccessKey: "${LOKI_S3_SECRET_ACCESS_KEY}"
                s3ForcePathStyle: true
                insecure: true

            structuredConfig:
              ingester_client:
                grpc_client_config:
                  max_recv_msg_size: 104857600
                  max_send_msg_size: 104857600

          # ── Write path ────────────────────────────────────────────────────────────────
          distributor:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: distributor
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi

          ingester:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            persistence:
              enabled: true
              storageClass: longhorn
              size: 20Gi
            affinity:
              podAntiAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  - labelSelector:
                      matchLabels:
                        app.kubernetes.io/component: ingester
                    topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: "2"
                memory: 4Gi

          patternIngester:
            enabled: true
            replicas: 2
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: pattern-ingester
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi

          # ── Read path ─────────────────────────────────────────────────────────────────
          queryFrontend:
            replicas: 2
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: query-frontend
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 1Gi

          queryScheduler:
            enabled: true
            replicas: 2
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

          querier:
            replicas: 3
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: querier
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 4Gi

          indexGateway:
            enabled: true
            replicas: 2
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            persistence:
              enabled: true
              storageClass: longhorn
              size: 10Gi
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: index-gateway
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi

          # ── Backend / Singleton ───────────────────────────────────────────────────────
          compactor:
            replicas: 1                        # MUST be 1 — concurrent compactors corrupt index
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            persistence:
              enabled: true
              storageClass: longhorn
              size: 10Gi
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "1"
                memory: 2Gi

          ruler:
            enabled: true
            replicas: 2
            extraArgs:
              - -config.expand-env=true
            extraEnvFrom:
              - secretRef:
                  name: loki-object-storage
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: ruler
                      topologyKey: kubernetes.io/hostname
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi

          # ── SimpleScalable / monolithic components disabled ───────────────────────────
          singleBinary:
            replicas: 0
          write:
            replicas: 0
          read:
            replicas: 0
          backend:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0

          # ── Caches ────────────────────────────────────────────────────────────────────
          chunksCache:
            enabled: true
            replicas: 1
            allocatedMemory: 4096

          resultsCache:
            enabled: true
            replicas: 1

          # ── Gateway ───────────────────────────────────────────────────────────────────
          gateway:
            enabled: true
            replicas: 2
            affinity:
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      labelSelector:
                        matchLabels:
                          app.kubernetes.io/component: gateway
                      topologyKey: kubernetes.io/hostname

          # ── Monitoring ───────────────────────────────────────────────────────────────
          monitoring:
            serviceMonitor:
              enabled: true
              metricsInstance:
                enabled: false
            rules:
              enabled: true
            dashboards:
              enabled: true
            selfMonitoring:
              enabled: false
              grafanaAgent:
                installOperator: false

          minio:
            enabled: false

    # Cluster-specific overlays: dashboards etc.
    - repoURL: {{ .Values.repository.url }}
      path: core-charts/loki-extras
      targetRevision: HEAD
{{- end }}
