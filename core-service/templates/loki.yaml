apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: loki
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: loki
      targetRevision: 14.*
      helm:
        valuesObject:
          loki:
            auth_enabled: false
            commonConfig:
              replication_factor: 1
            schemaConfig:
              configs:
                - from: "2024-04-01"
                  store: tsdb
                  object_store: filesystem
                  schema: v13
                  index:
                    prefix: loki_index_
                    period: 24h
            pattern_ingester:
              enabled: true
            limits_config:
              allow_structured_metadata: true
              volume_enabled: true
              retention_period: 744h  # 31 days
            compactor:
              retention_enabled: true
              delete_request_store: filesystem
              working_directory: /var/loki/compactor
            ruler:
              enable_api: true
            storage:
              type: filesystem

          monitoring:
            serviceMonitor:
              enabled: true
            rules:
              enabled: true
            dashboards:
              enabled: true

          minio:
            enabled: false

          deploymentMode: Monolithic

          singleBinary:
            replicas: 1
            persistence:
              enabled: true
              size: 80Gi

          # Zero out replica counts of other deployment modes
          backend:
            replicas: 0
          read:
            replicas: 0
          write:
            replicas: 0

          ingester:
            replicas: 0
          querier:
            replicas: 0
          queryFrontend:
            replicas: 0
          queryScheduler:
            replicas: 0
          distributor:
            replicas: 0
          indexGateway:
            replicas: 0
          bloomCompactor:
            replicas: 0
          bloomGateway:
            replicas: 0
          chunksCache:
            allocatedMemory: 2000

          gateway:
            nginxConfig:
              resolver: rke2-coredns-rke2-coredns.kube-system.svc.cluster.local

