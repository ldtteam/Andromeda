apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: alloy
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: k8s-monitoring
      targetRevision: 3.6.1
      helm:
        valuesObject:
          global:
            dnsService: "rke2-coredns-rke2-coredns"
          cluster:
            name: andromeda

          destinations:
            - name: loki
              type: loki
              url: http://loki-gateway.meta.svc.cluster.local/loki/api/v1/push

          clusterEvents:
            enabled: true
            collector: alloy-logs

          nodeLogs:
            enabled: false

          podLogs:
            enabled: true
            gatherMethod: kubernetesApi
            collector: alloy-logs
            labelsToKeep: ["app_kubernetes_io_name","container","instance","job","level","namespace","service_name","service_namespace","deployment_environment","deployment_environment_name"]
            structuredMetadata:
              pod: pod  # Set structured metadata "pod" from label "pod"

          # Collectors
          alloy-singleton:
            enabled: false

          alloy-metrics:
            enabled: false

          alloy-logs:
            enabled: true
            alloy:
              mounts:
                varlog: false
                dockercontainers: false
              clustering:
                enabled: true

          alloy-profiles:
            enabled: false

          alloy-receiver:
            enabled: false