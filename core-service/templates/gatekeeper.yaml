apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: gatekeeper-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://open-policy-agent.github.io/gatekeeper/charts
      chart: gatekeeper
      targetRevision: v3.17.0
      helm:
        valuesObject:
          postInstall:
            labelNamespace:
              extraRules:
                - apiGroups:
                    - management.cattle.io
                  resources:
                    - projects
                  verbs:
                    - updatepsa