apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd
spec:
  project: default
  destination:
    server: "https://kubernetes.default.svc"
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      # NOTE: check https://artifacthub.io/packages/helm/external-dns/external-dns for the latest stable
      targetRevision: 1.21.1
      helm:
        skipCrds: true
        releaseName: external-dns-parchment
        valuesObject:
          extraArgs:
            cloudflare-proxied: null
          provider:
            name: cloudflare
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: parchmentmc-cloudflare-api-token-secret
                  key: cloudflare_api_token
          sources:
            - service
            - ingress
            - gateway-httproute
            - gateway-grpcroute
            - gateway-tlsroute
          domainFilters:
            - parchmentmc.net
            - parchmentmc.org
          annotationFilter: "external-dns.alpha.kubernetes.io/target"
    - repoURL: https://kubernetes-sigs.github.io/external-dns/
      chart: external-dns
      # NOTE: check https://artifacthub.io/packages/helm/external-dns/external-dns for the latest stable
      targetRevision: 1.21.1
      helm:
        releaseName: external-dns-hetzner
        valuesObject:
          provider:
            name: webhook
            webhook:
              image:
                repository: "ghcr.io/mconfalonieri/external-dns-hetzner-webhook"
                tag: "v0.12.0"
              livenessProbe:
                httpGet:
                  path: /health
                  port: http-webhook
                initialDelaySeconds: 10
                timeoutSeconds: 5
              readinessProbe:
                httpGet:
                  path: /ready
                  port: http-webhook
                initialDelaySeconds: 10
                timeoutSeconds: 5
              env:
                - name: USE_CLOUD_API
                  value: "true"
                - name: HETZNER_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: hetzner-credentials
                      key: api-key
          sources:
            - service
            - ingress
            - gateway-httproute
            - gateway-grpcroute
            - gateway-tlsroute
          domainFilters:
            - ldtteam.com
            - minecolonies.com
            - hermans-code.com
            - chisels-and-bits.com
            - communi-suggestu.com
          annotationFilter: "external-dns.alpha.kubernetes.io/target"
    - repoURL: {{ .Values.repository.url }}
      path: core-charts/external-dns-extras
      targetRevision: HEAD

